name: sys06-mcp-demo

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ./bin/rails server -b '0.0.0.0'
    image: mcp-server-integration-demo
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - node_modules:/rails/node_modules
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://admin:adminpassword@mongodb:27017/mcp_demo_rails?authSource=admin
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8.0
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init/:/docker-entrypoint-initdb.d/:ro
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword
      - MONGO_INITDB_DATABASE=mcp_demo

  mcp-server:
    build:
      context: ./docker/mcp-server
      dockerfile: Dockerfile
    image: sys-06-mcp-filesystem-server
    ports:
      - "8000:8000"
    volumes:
      - ./test:/workspace
    environment:
      - WORKSPACE_ROOT=/workspace
      - PORT=8000

  ngrok-mcp:
    image: ngrok/ngrok:latest
    command: http mcp-server:8000 --log=stdout
    ports:
      - "4041:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - mcp-server

volumes:
  mongodb_data:
  bundle_cache:
  node_modules:
