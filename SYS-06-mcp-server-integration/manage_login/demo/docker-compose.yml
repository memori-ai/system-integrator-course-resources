name: sys06-mcp-demo

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ./bin/rails server -b '0.0.0.0'
    image: mcp-server-integration-demo
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - node_modules:/rails/node_modules
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://admin:adminpassword@mongodb:27017/mcp_demo_rails?authSource=admin
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8.0
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init/:/docker-entrypoint-initdb.d/:ro
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword
      - MONGO_INITDB_DATABASE=mcp_demo

volumes:
  mongodb_data:
  bundle_cache:
  node_modules:
