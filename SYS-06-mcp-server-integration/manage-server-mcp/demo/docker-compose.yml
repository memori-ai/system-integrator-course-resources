name: sys06-mcp-demo

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ./bin/rails server -b '0.0.0.0'
    image: mcp-server-integration-demo
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - node_modules:/rails/node_modules
    ports:
      - "3006:3000"
    environment:
      - MONGO_URI=mongodb://admin:adminpassword@mongodb:27017/mcp_demo_rails?authSource=admin
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=mcp_demo_mysql
      - MYSQL_USER=mcpuser
      - MYSQL_PASSWORD=mcppassword
    depends_on:
      - mongodb
      - mysql

  mongodb:
    image: mongo:8.0
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init/:/docker-entrypoint-initdb.d/:ro
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword
      - MONGO_INITDB_DATABASE=mcp_demo

  mysql:
    image: mysql:8.0
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init/:/docker-entrypoint-initdb.d/:ro
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=mcp_demo_mysql
      - MYSQL_USER=mcpuser
      - MYSQL_PASSWORD=mcppassword

  mcp-server:
    build:
      context: ./docker/mcp-server
      dockerfile: Dockerfile
    image: sys-06-mcp-filesystem-server
    ports:
      - "8000:8000"
    volumes:
      - ./test:/workspace
    environment:
      - WORKSPACE_ROOT=/workspace
      - PORT=8000

  mcp-server-mysql:
    build:
      context: ./docker/mcp-server-mysql
      dockerfile: Dockerfile
    image: sys-06-mcp-mysql-server
    ports:
      - "8001:8001"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=mcp_demo_mysql
      - MYSQL_USER=mcpuser
      - MYSQL_PASSWORD=mcppassword
      - PORT=8001
    depends_on:
      - mysql

  ngrok-mcp:
    image: ngrok/ngrok:latest
    command: http mcp-server:8000 --log=stdout
    ports:
      - "4041:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - mcp-server

  ngrok-mcp-mysql:
    image: ngrok/ngrok:latest
    command: http mcp-server-mysql:8001 --log=stdout
    ports:
      - "4042:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - mcp-server-mysql

volumes:
  mongodb_data:
  mysql_data:
  bundle_cache:
  node_modules:
