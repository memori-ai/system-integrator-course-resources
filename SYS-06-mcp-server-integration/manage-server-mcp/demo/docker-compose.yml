name: sys06-mcp-demo

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ./bin/rails server -b '0.0.0.0'
    image: mcp-server-integration-demo
    volumes:
      - .:/rails
      # Demo 5: the two agent prompts live one level up and are served as
      # downloads by demo5#prompt, so the page can hand them to attendees who
      # have no copy of this repository. Read-only: the app never writes here.
      - ../agents:/rails/agents:ro
      - bundle_cache:/usr/local/bundle
      - node_modules:/rails/node_modules
    ports:
      - "13006:3000"
    environment:
      - MONGO_URI=mongodb://admin:adminpassword@mongodb:27017/mcp_demo_rails?authSource=admin
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=mcp_demo_mysql
      - MYSQL_USER=mcpuser
      - MYSQL_PASSWORD=mcppassword
      # Docker access goes through the socket proxy: the app can only
      # start/stop containers, everything else is blocked by the proxy.
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      # Demo 6: the page reads the fake ERP through the same public API the
      # agent uses, just over the compose network instead of the tunnel.
      - GESTIONALE_URL=http://gestionale:8100
      - GESTIONALE_CLIENT_ID=aisuru-demo
      - GESTIONALE_CLIENT_SECRET=demo-secret-sys06
      - GESTIONALE_ADMIN_TOKEN=sys06-demo-admin
    depends_on:
      - mongodb
      - mysql
      - docker-socket-proxy
      - gestionale

  # Filtered gateway to the Docker socket used by the one-click demo starter.
  # Only the container and image/network APIs needed by "docker compose up/stop"
  # are exposed; dangerous sections (exec, volumes, build, swarm...) stay blocked.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - INFO=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  mongodb:
    image: mongo:8.0
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init/:/docker-entrypoint-initdb.d/:ro
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword
      - MONGO_INITDB_DATABASE=mcp_demo

  mysql:
    image: mysql:8.0
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init/:/docker-entrypoint-initdb.d/:ro
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=mcp_demo_mysql
      - MYSQL_USER=mcpuser
      - MYSQL_PASSWORD=mcppassword

  mcp-server:
    build:
      context: ./docker/mcp-server
      dockerfile: Dockerfile
    image: sys-06-mcp-filesystem-server
    ports:
      - "8000:8000"
    volumes:
      - ./test:/workspace
    environment:
      - WORKSPACE_ROOT=/workspace
      - PORT=8000

  # Demo 6: fake ERP exposed as a plain REST API with OAuth2 client
  # credentials. The AIsuru OAuth/API connector imports its /openapi.json.
  gestionale:
    build:
      context: ./docker/gestionale
      dockerfile: Dockerfile
    image: sys-06-gestionale-api
    ports:
      - "8100:8100"
    volumes:
      - gestionale_data:/data
    environment:
      - GESTIONALE_DB=/data/gestionale.db
      - GESTIONALE_CLIENT_ID=aisuru-demo
      - GESTIONALE_CLIENT_SECRET=demo-secret-sys06
      - GESTIONALE_JWT_SECRET=sys06-demo-jwt-secret
      - GESTIONALE_ADMIN_TOKEN=sys06-demo-admin

  # ngrok tunnels: free accounts allow only ONE active agent at a time, so
  # the tunnels live in the "tunnels" profile and are NOT started by default.
  # They are started on demand by the "Start demo" button in the web UI
  # (or manually: docker compose up -d <service>).
  ngrok-mcp:
    image: ngrok/ngrok:latest
    command: http mcp-server:8000 --log=stdout
    ports:
      - "4041:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - mcp-server
    profiles: ["tunnels"]

  # TCP tunnel for Demo 2 (MySQL): exposes the database so AIsuru's built-in
  # MySQL MCP server can connect to it directly.
  ngrok-demo2:
    image: ngrok/ngrok:latest
    command: tcp mysql:3306 --log=stdout
    ports:
      - "4044:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - mysql
    profiles: ["tunnels"]

  # TCP tunnel for Demo 1 (MongoDB): replaces the manual "ngrok tcp 27017"
  # previously required on the host machine.
  ngrok-mongo:
    image: ngrok/ngrok:latest
    command: tcp mongodb:27017 --log=stdout
    ports:
      - "4043:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - mongodb
    profiles: ["tunnels"]

  # HTTP tunnel for Demo 6 (fake ERP): the OAuth/API connector only accepts
  # https:// URLs, so the API has to be reachable through the tunnel.
  ngrok-gestionale:
    image: ngrok/ngrok:latest
    command: http gestionale:8100 --log=stdout
    ports:
      - "4045:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - gestionale
    profiles: ["tunnels"]

volumes:
  mongodb_data:
  mysql_data:
  bundle_cache:
  node_modules:
  gestionale_data:
